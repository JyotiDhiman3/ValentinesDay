<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family: Arial, sans-serif;
    text-align:center;

    background: linear-gradient(135deg,#ff9ec4,#ff4d6d,#ffc2d1);
    background-size: 400% 400%;
    animation: sparkleBG 8s ease infinite;
}

@keyframes sparkleBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

/* Sparkles */
.sparkle {
    position: fixed;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity:.8;
    animation: twinkle 2s infinite;
}

@keyframes twinkle {
    0%{opacity:.2;}
    50%{opacity:1;}
    100%{opacity:.2;}
}

/* Hearts */
.heart {
    position: fixed;
    bottom:-10px;
    color:red;
    font-size:18px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    to {transform: translateY(-110vh);}
}

.box {
    background:white;
    padding:40px;
    border-radius:20px;
    display:inline-block;
    margin-top:15vh;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{ color:#e63946; }

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#e63946;
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#ffd6d6;
    color:#e63946;
    position:relative;
}

#msg{
    font-size:24px;
    color:#e63946;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h1>💖 Will you be my valentine Ankita? 💖</h1>

    <button id="yes" onclick="yesClick()">Yes 💘</button>
    <button id="no">No 💔</button>

    <div id="msg"></div>
</div>

<script>

/* YES click */
function yesClick(){
    document.getElementById("msg").innerHTML =
    "Yayyy!! 💕 Best Decision Ever!! 😍💖";

    // 👇 Make NO disappear
    document.getElementById("no").style.display = "none";
}

/* NO runs away */
const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{
    const x=Math.random()*(window.innerWidth-80);
    const y=Math.random()*(window.innerHeight-80);

    noBtn.style.position="absolute";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
});

/* Hearts */
function heart(){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
}
setInterval(heart,300);

/* Sparkles */
function sparkle(){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2000);
}
setInterval(sparkle,200);

</script>

</body>
</html>
